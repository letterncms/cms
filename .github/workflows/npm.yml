# Publishes the npm packages a release carries, with no stored token: npm trusts this workflow.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish what this release carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'letterncms-*.tgz'

          for file in letterncms-*.tgz; do
            spec="$(tar -xzOf "$file" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')"

            # The very first release goes up by hand, before anyone can trust this workflow.
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published."
            else
              npm publish "./$file" --access public
            fi
          done
